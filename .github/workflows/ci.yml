name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Build first — it runs codegen (orval) to produce src/generated/, which is
      # gitignored and required by the typechecks below.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Type check scripts
        run: pnpm typecheck:scripts
