name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Build first — it runs codegen (orval) to produce src/generated/, which is
      # gitignored and required by the typecheck below.
      - name: Build
        run: pnpm build

      # Covers src, scripts, codegen.ts and openapi/ — see tsconfig.json.
      - name: Type check
        run: pnpm typecheck

  # The org ruleset requires exactly one context, `ci`, across every repo (see
  # org-require-ci in BorrowBetter/terraform-github). Repos do not agree on what
  # they run, so they agree on the name of the job that reports — this one fans
  # in whatever runs above, including every leg of the matrix, so jobs can be
  # added or split without touching the ruleset.
  #
  # `if: always()` is load-bearing. Without it this job is SKIPPED when a
  # dependency fails, and a skipped check does not fail a required status check
  # — the gate would go green exactly when the build broke.
  #
  # The condition deliberately ignores `skipped`, which is safe only because
  # every job in `needs` runs unconditionally. Give one of them an `if:` or a
  # path filter and add 'skipped' here too, or an upstream skip passes the gate.
  ci:
    # Explicit, even though it matches the job id — this string is the org
    # ruleset's required context, so it must not silently follow a rename.
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
