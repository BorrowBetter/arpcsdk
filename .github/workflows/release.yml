name: Release

on:
  push:
    branches: [main]
  # Manual trigger publishes the current package.json version (no versioning) —
  # e.g. to (re)publish a version that was bumped but isn't on npm yet.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The merge step blocks on the version PR's checks; cap it so a check that
    # never reports fails the run instead of holding a runner for six hours.
    timeout-minutes: 30
    permissions:
      # Everything that writes to the repo uses the app token below, not
      # GITHUB_TOKEN. id-token is for npm's OIDC exchange.
      contents: read
      id-token: write

    steps:
      # Every repo-facing action — pushing the version branch, opening the PR,
      # merging it — runs as the borrowbetter-automation app. Nothing reaches
      # main except through a PR; the app is a `pull_request`-mode bypass actor
      # on org-require-pr-review, which is what lets it merge its own version
      # PR without a human approving a mechanical bump.
      #
      # GITHUB_TOKEN can't stand in here on two counts: it can't be a ruleset
      # bypass actor, and PRs it opens don't trigger workflows — the version PR
      # would sit there with no checks to wait on.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Persisted into .git/config, which is what authenticates the
          # `git push` in Open version PR.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # Three mutually exclusive outcomes:
      #   manual run          → publish whatever version package.json holds
      #   pending changesets  → open the version PR; its merge re-runs this
      #                         workflow, and that run publishes
      #   nothing pending     → publish iff package.json's version is new to npm
      #                         (i.e. we are the version PR's merge). Ordinary
      #                         merges to main land here and no-op.
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          version=false
          publish=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish=true
          elif [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            version=true
          else
            pkg=$(node -p "require('./package.json').name")
            ver=$(node -p "require('./package.json').version")
            if [ -z "$(npm view "$pkg@$ver" version 2>/dev/null)" ]; then
              publish=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Open version PR
        id: version-pr
        if: steps.plan.outputs.version == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # @changesets/changelog-github reads pull request metadata to build
          # the changelog entries.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          branch=changeset-release/main

          # Author the commit as the app's own bot user. org-require-pr-review
          # sets require_extra_approval_for_unattributed_changes, and there's no
          # human on this PR to supply that extra approval.
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          pnpm changeset version
          git add .
          git commit -m "chore: version packages"
          # Force-push: a version PR left open by an earlier failed run is stale
          # by definition — its changesets are still in main and get re-consumed
          # here, so the rebuilt branch supersedes it.
          git push --force origin "HEAD:refs/heads/$branch"

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: version packages" \
              --body "Consumes the pending changesets: bumps \`package.json\` and updates \`CHANGELOG.md\`. Opened by the Release workflow, which merges it once checks are green; that merge triggers the npm publish."
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      # Gates on *every* check the PR collects, not just the ones the org
      # ruleset marks required — the CI matrix isn't a required context, and
      # we'd rather not publish off a red typecheck.
      - name: Merge version PR on green
        if: steps.plan.outputs.version == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.version-pr.outputs.pr }}
        run: |
          set -euo pipefail
          # `gh pr checks --watch` exits non-zero when nothing has reported yet,
          # so wait for the checks to register before handing off to it.
          for _ in $(seq 1 30); do
            n=$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup | length')
            [ "$n" -gt 0 ] && break
            sleep 10
          done
          gh pr checks "$PR" --watch --fail-fast --interval 15
          # Merging pushes main, which re-runs this workflow with no changesets
          # pending — that run does the publish.
          gh pr merge "$PR" --squash --delete-branch

      # Build runs codegen (orval) → src/generated/, then tsup → dist/.
      - name: Build
        if: steps.plan.outputs.publish == 'true'
        run: pnpm build

      # Trusted publishing (OIDC) — no NPM_TOKEN. Needs npm >= 11.5.1; node 24's
      # bundled npm predates it, so pull the latest first.
      - name: Update npm
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@latest

      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into the
      # .npmrc; with no token that line makes npm attempt empty-token auth instead
      # of the OIDC exchange. Strip it so npm falls through to OIDC (registry-url
      # stays, so npm still targets npmjs.org).
      # https://github.com/actions/setup-node/issues/1551
      - name: Enable OIDC (strip token line from .npmrc)
        if: steps.plan.outputs.publish == 'true'
        run: sed -i '/_authToken/d; /always-auth/d' "$NPM_CONFIG_USERCONFIG"

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public
