name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # Build runs codegen (orval) → src/generated/, then tsup → dist/.
      - name: Build
        run: pnpm build

      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -v README.md > /dev/null; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          git add .
          git commit -m "chore: version packages"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild after version bump
        if: steps.check.outputs.has_changesets == 'true'
        run: pnpm build

      # Trusted publishing (OIDC) — no NPM_TOKEN. Needs npm >= 11.5.1; node 24's
      # bundled npm predates it, so pull the latest first.
      - name: Update npm
        if: steps.check.outputs.has_changesets == 'true'
        run: npm install -g npm@latest && npm -v

      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into the
      # .npmrc. With no token that line makes npm attempt empty-token auth instead
      # of the OIDC exchange (ENEEDAUTH / E404). Strip it (and always-auth) so npm
      # falls through to OIDC trusted publishing — keeping registry-url so npm still
      # targets npmjs.org. https://github.com/actions/setup-node/issues/1551
      - name: Enable OIDC (strip token lines from .npmrc)
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d; /always-auth/d' "$NPM_CONFIG_USERCONFIG"
            echo "--- .npmrc after strip ---"; cat "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'true'
        run: npm publish --access public
