name: Release

on:
  push:
    branches: [main]
  # Manual trigger publishes the current package.json version (no versioning) —
  # e.g. to (re)publish a version that was bumped but isn't on npm yet.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # Build runs codegen (orval) → src/generated/, then tsup → dist/.
      - name: Build
        run: pnpm build

      # A manual run publishes the current version; a push with pending changesets
      # versions first, then publishes.
      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=false" >> "$GITHUB_OUTPUT"
            echo "publish=true"  >> "$GITHUB_OUTPUT"
          elif ls .changeset/*.md 2>/dev/null | grep -v README.md > /dev/null; then
            echo "version=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.plan.outputs.version == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          git add .
          git commit -m "chore: version packages"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild after version bump
        if: steps.plan.outputs.version == 'true'
        run: pnpm build

      # Trusted publishing (OIDC) — no NPM_TOKEN. Needs npm >= 11.5.1; node 24's
      # bundled npm predates it, so pull the latest first.
      - name: Update npm
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@latest

      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into the
      # .npmrc; with no token that line makes npm attempt empty-token auth instead
      # of the OIDC exchange. Strip it so npm falls through to OIDC (registry-url
      # stays, so npm still targets npmjs.org).
      # https://github.com/actions/setup-node/issues/1551
      - name: Enable OIDC (strip token line from .npmrc)
        if: steps.plan.outputs.publish == 'true'
        run: sed -i '/_authToken/d; /always-auth/d' "$NPM_CONFIG_USERCONFIG"

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public
