name: Release

on:
  push:
    branches: [main]
  # Manual trigger publishes the current package.json version (no versioning) —
  # e.g. to (re)publish a version that was bumped but isn't on npm yet.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # The version-bump push below goes straight to main, which the
      # org-require-pr-review ruleset forbids for everyone except the
      # borrowbetter-automation app. GITHUB_TOKEN cannot be a ruleset bypass
      # actor, so the push has to carry an app installation token.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Persisted into .git/config, which is what authenticates the
          # `git push` in Version packages.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # Build runs codegen (orval) → src/generated/, then tsup → dist/.
      - name: Build
        run: pnpm build

      # A manual run publishes the current version; a push with pending changesets
      # versions first, then publishes.
      #
      # The [skip ci] on the version commit matters now that the push carries an
      # app token: unlike GITHUB_TOKEN, an app-token push DOES trigger
      # workflows. Without it every release re-fires this workflow (a no-op --
      # the changesets are consumed) plus the full three-version CI matrix.
      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=false" >> "$GITHUB_OUTPUT"
            echo "publish=true"  >> "$GITHUB_OUTPUT"
          elif ls .changeset/*.md 2>/dev/null | grep -v README.md > /dev/null; then
            echo "version=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.plan.outputs.version == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          git add .
          git commit -m "chore: version packages [skip ci]"
          git push
        env:
          # Deliberately NOT the app token: @changesets/changelog-github reads
          # pull request metadata to build the changelog, and the app is scoped
          # to contents only. GITHUB_TOKEN keeps doing that half of the job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild after version bump
        if: steps.plan.outputs.version == 'true'
        run: pnpm build

      # Trusted publishing (OIDC) — no NPM_TOKEN. Needs npm >= 11.5.1; node 24's
      # bundled npm predates it, so pull the latest first.
      - name: Update npm
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@latest

      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into the
      # .npmrc; with no token that line makes npm attempt empty-token auth instead
      # of the OIDC exchange. Strip it so npm falls through to OIDC (registry-url
      # stays, so npm still targets npmjs.org).
      # https://github.com/actions/setup-node/issues/1551
      - name: Enable OIDC (strip token line from .npmrc)
        if: steps.plan.outputs.publish == 'true'
        run: sed -i '/_authToken/d; /always-auth/d' "$NPM_CONFIG_USERCONFIG"

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public
